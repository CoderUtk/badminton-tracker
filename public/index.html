<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="CourtSide — score and follow badminton matches and tournaments live. Run a bracket, keep score, and share a link to spectate."
    />
    <link rel="canonical" href="https://courtside-links.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CourtSide" />
    <meta property="og:title" content="CourtSide — Live Badminton Scoring & Tournaments" />
    <meta
      property="og:description"
      content="Score and follow badminton matches and tournaments live. Run a bracket, keep score, and share a link to spectate."
    />
    <meta property="og:url" content="https://courtside-links.vercel.app/" />
    <meta property="og:image" content="https://courtside-links.vercel.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CourtSide — Live Badminton Scoring & Tournaments" />
    <meta
      name="twitter:description"
      content="Score and follow badminton matches and tournaments live. Run a bracket, keep score, and share a link to spectate."
    />
    <meta name="twitter:image" content="https://courtside-links.vercel.app/icons/icon-512.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CourtSide",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Android, iOS",
        "description": "Score and follow badminton matches and tournaments live. Run a bracket, keep score, and share a link to spectate."
      }
    </script>

    <!-- PWA: identity + install metadata. `expo export -p web` with `web.output: single`
         uses this file as the HTML template (public/index.html takes precedence over
         Expo's built-in template); app/+html.tsx only applies to static/server output. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0C0E12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CourtSide" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #0C0E12;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
