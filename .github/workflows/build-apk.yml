name: Build release APK

# Manual only. Auto-build on every push to master burned CI minutes on
# doc-only and refactor commits that produce an identical APK. Trigger from
# Actions -> "Build release APK" -> "Run workflow", picking the branch there.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      - name: Write .env for build-time public config
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Generate native android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup upload keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload.keystore

      - name: Build release APK
        working-directory: android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: true
        run: ./gradlew assembleRelease

      - name: Publish to the "latest" GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build
          body: Auto-built from ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          artifacts: android/app/build/outputs/apk/release/app-release.apk
