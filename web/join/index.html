<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CourtSide</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0C0E12; color: #fff; font-family: -apple-system, Roboto, sans-serif; padding: 24px; }
  .card { max-width: 360px; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #9BA3B2; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
  a.cta { display: inline-block; background: #FF3B30; color: #fff; text-decoration: none;
    padding: 14px 28px; border-radius: 12px; font-weight: 700; }
  #debug { margin-top: 28px; text-align: left; font-size: 11px; line-height: 1.6; color: #5A6270;
    font-family: monospace; word-break: break-all; border-top: 1px solid #1E222B; padding-top: 16px; }
  #debug b { color: #9BA3B2; }
</style>
</head>
<body>
  <div class="card">
    <h1>Open this in CourtSide</h1>
    <p>This link opens the CourtSide app. If it didn't open automatically, get the app
    from Google Play, then tap the link again.</p>
    <a class="cta" href="https://play.google.com/store/apps/details?id=com.navalo.courtside">Get it on Google Play</a>
    <div id="debug"></div>
  </div>
  <script>
    (function () {
      var pkg = "com.navalo.courtside";
      var storeUrl = "https://play.google.com/store/apps/details?id=" + pkg;
      var isAndroid = /Android/i.test(navigator.userAgent);
      var debugEl = document.getElementById("debug");

      function log(lines) {
        debugEl.innerHTML = lines.map(function (l) {
          return "<div><b>" + l[0] + ":</b> " + l[1] + "</div>";
        }).join("");
      }

      var info = [
        ["href", location.href],
        ["referrer", document.referrer || "(none)"],
        ["userAgent", navigator.userAgent],
        ["isAndroid", String(isAndroid)],
        ["intentAttempted", "false"],
        ["time", new Date().toISOString()],
      ];
      log(info);

      if (isAndroid) {
        var intentUrl = "intent://" + location.host + location.pathname + location.search +
          "#Intent;scheme=https;package=" + pkg +
          ";S.browser_fallback_url=" + encodeURIComponent(storeUrl) + ";end";
        info[4] = ["intentAttempted", "true"];
        info.push(["intentUrl", intentUrl]);
        log(info);
        location.href = intentUrl;
      }
    })();
  </script>
</body>
</html>
